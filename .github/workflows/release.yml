name: release
# Publishes to PyPI (journeyman-bench) ONLY on a version tag — cutting the
# tag is the human release signature. Requires PyPI "trusted publisher"
# configured for codechu/journeyman + this workflow (no token in repo).
on:
  push: {tags: ["v*"]}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    # contents: write — the last step creates the GitHub release from the
    # tag. With contents: read it 403s AFTER the package is already on PyPI,
    # which is the worst place to fail: the release half-happened, and the
    # dataset job behind it never ran. (v0.2.0, 2026-08-29.)
    permissions: {id-token: write, contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      # The four version records are checked against each other by the test
      # suite, but nothing checked them against the tag being released. A tag
      # can therefore ship a package whose version is something else entirely —
      # the same silent mismatch that made 0.1.1 stamp its reports 0.1.0.
      - name: tag matches the packaged version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$v" = "$GITHUB_REF_NAME" ] || {
            echo "tag $GITHUB_REF_NAME does not match packaged version $v"; exit 1; }
          echo "tag and package agree: $v"

      - run: python -m pip install build && python -m build
      # The suite runs HERE, not only in ci.yml. A tag triggers this workflow
      # directly, so a red CI run on the same commit does not stop a release:
      # on 2026-08-28 ci failed at 19:29:49 and the release for that commit
      # started at 19:29:52 and published. What it caught was the version
      # drift guard — the package went out stamping its reports with a version
      # that did not produce them. A release proves itself; it does not
      # inherit a sibling workflow's word for it.
      - run: python -m unittest discover -s tests
      - run: python -m journeyman selftest
      - uses: pypa/gh-action-pypi-publish@release/v1

      # The package going out is not the same as the release being visible.
      # v0.1.1 and v0.1.2 shipped to PyPI while the Releases page still read
      # v0.1.0, because every earlier release object had been made by hand and
      # nothing here made one. Notes come from the tag's CHANGELOG section, so
      # a release cannot appear without the entry that explains it.
      - name: github release
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          v="${GITHUB_REF_NAME#v}"
          python - "$v" > /tmp/notes.md <<'PY'
          import re, sys
          v = sys.argv[1]
          text = open("CHANGELOG.md").read()
          # \Z so the newest section still matches when it is the only one —
          # the old pattern required a following "## " and fell through to a
          # placeholder on a first release or after archiving older entries.
          m = re.search(rf"^## {re.escape(v)}[^\n]*\n(.*?)(?=^## |\Z)",
                        text, re.M | re.S)
          if not m or not m.group(1).strip():
              # Never publish a release whose notes say there are none: a
              # placeholder body is indistinguishable from a real one, and
              # nothing downstream would have failed.
              sys.exit(f"CHANGELOG.md has no section for {v} — the changelog "
                       f"entry is the release note, so there is nothing to "
                       f"publish. Add '## {v} — <date>' and re-run.")
          sys.stdout.write(m.group(1).strip() + "\n")
          PY
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::warning::a release for $GITHUB_REF_NAME already exists;" \
                 "leaving its notes alone rather than overwriting them"
          else
            # Pre-1.0 carries no stability promise, so the release says so
            # rather than leaving a reader to infer it from the number. Set
            # by the version, not by hand: marking one release and forgetting
            # the next is worse than marking none. It stops at 1.0 on its own.
            case "$v" in 0.*) pre="--prerelease" ;; *) pre="" ;; esac
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --verify-tag $pre --notes-file /tmp/notes.md
          fi

  # The calibration set is the one artifact an outside reader wants to look at
  # without installing anything, so it goes to a dataset repo on the same tag
  # that ships the package — a card that lags the set is worse than no card.
  # Runs only with a repository secret; without it the step says so and passes,
  # because a fork or a fresh clone should not fail its release over a channel
  # it has not been given keys to.
  dataset:
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install huggingface_hub
      - run: python tools/hf_sync.py
        env: {HF_TOKEN: "${{ secrets.HF_TOKEN }}"}
