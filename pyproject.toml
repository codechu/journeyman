[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "journeyman-bench"
version = "0.0.3"
description = "Journeyman - a process-quality benchmark for agents. Measures how agents work, and how they fail."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Codechu"}]
keywords = ["benchmark", "llm", "agents", "evaluation", "process-quality"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/codechu/journeyman"

[project.scripts]
journeyman = "journeyman.__main__:main"

[tool.setuptools.packages.find]
include = ["journeyman*"]

[tool.setuptools.package-data]
journeyman = ["calibration/*.json", "schema/*.json"]
