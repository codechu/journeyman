name: hf-sync
# Publishes the calibration set to the Hugging Face dataset repo. Normally this
# rides along with a release (see release.yml); this manual trigger exists so the
# dataset can be re-synced without cutting a version — e.g. after a card change.
# Needs the HF_TOKEN repository secret; without it the script says so and passes.
on:
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python -m pip install huggingface_hub
      - run: python tools/hf_sync.py
        env: {HF_TOKEN: "${{ secrets.HF_TOKEN }}"}
