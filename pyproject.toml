[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "journeyman-bench"
version = "0.1.2"
description = "A process-quality benchmark for LLM agents: it grades how an agent worked, not whether it passed — and every LLM-as-a-judge sits a calibrated exam before it may score."
readme = "README.pypi.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Codechu"}]
keywords = [
  "benchmark", "evals", "evaluation", "agents", "ai-agents", "llm", "llm-agents",
  "agent-benchmark", "agent-evaluation", "llm-evaluation", "llm-as-a-judge",
  "llm-judge", "process-quality", "tool-use", "agentic",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/codechu/journeyman"
Repository = "https://github.com/codechu/journeyman"
Documentation = "https://github.com/codechu/journeyman/blob/master/docs/methodology.md"
Changelog = "https://github.com/codechu/journeyman/blob/master/CHANGELOG.md"
"Judge registry" = "https://github.com/codechu/journeyman/blob/master/docs/judges.md"
Leaderboard = "https://github.com/codechu/journeyman/blob/master/docs/leaderboard.md"
Issues = "https://github.com/codechu/journeyman/issues"

[project.scripts]
journeyman = "journeyman.__main__:main"

[tool.setuptools.packages.find]
include = ["journeyman*"]

[tool.setuptools.package-data]
journeyman = ["calibration/*.json", "schema/*.json"]
