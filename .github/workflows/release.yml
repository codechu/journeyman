name: release
# Publishes to PyPI (journeyman-bench) ONLY on a version tag — cutting the
# tag is the human release signature. Requires PyPI "trusted publisher"
# configured for codechu/journeyman + this workflow (no token in repo).
on:
  push: {tags: ["v*"]}
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions: {id-token: write, contents: read}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install build && python -m build
      - run: python -m journeyman selftest
      - uses: pypa/gh-action-pypi-publish@release/v1
